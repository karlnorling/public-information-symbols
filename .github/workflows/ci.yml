name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Workspace integrity check (manypkg)
        run: yarn check

      # GitHub Actions only *warns* when an action is passed an input it does
      # not declare, so an action major bump that renames inputs fails silently
      # -- and the release job only runs on push to main, where it is too late.
      # Fails on an undeclared input; deprecations only warn.
      - name: Audit GitHub Action inputs
        run: yarn audit-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting (oxfmt)
        run: yarn format:check

      - name: Lint (oxlint)
        run: yarn lint

      - name: Lint CSS (stylelint)
        run: yarn lint:css

      - name: Type check
        run: yarn type-check

      - name: Compile
        run: yarn compile

      - name: Test
        run: yarn test

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: main

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PI_SYMBOLS_APP_ID }}
          private-key: ${{ secrets.PI_SYMBOLS_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile packages
        run: yarn compile

      - name: Create Version PR or Publish to npm
        uses: changesets/action@v2
        with:
          # v2 takes the token as an input and refuses to run when a mismatched
          # GITHUB_TOKEN is also present in the environment. Setting the env var
          # does not configure the action at all, which is how v1 did it.
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: yarn version-packages
          publish-script: bash scripts/publish.sh
          create-github-releases: true
